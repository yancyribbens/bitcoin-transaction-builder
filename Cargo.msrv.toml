[package]
name = "bitcoin-transaction-builder"
version = "0.1.0"
edition = "2021"
rust-version = "1.56.1"

[dependencies]
bitcoin = { version = "0.32", features = ["rand-std"] }
bitcoin-coin-selection = { version = "0.9", features = ["rand"] }
arbitrary = { version = "=1.0.1", optional = true }
rand = { version = "=0.8.5" }
cc = "=1.0.28"
libc = "=0.2.64"
ppv-lite86 = "=0.2.8"

