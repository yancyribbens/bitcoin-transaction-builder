[package]
authors = [
  "Yancy Ribbens <rust@yancy.lol>",
]
categories = ["cryptography", "finance"]
description = "A builder for Bitcoin Transactions"
edition = "2021"
keywords = ["bitcoin", "transaction", "wallet", "coin", "utxo"]
license = "MIT AND Apache-2.0"
name = "bitcoin-transaction-builder"
repository = "https://github.com/yancyribbens/bitcoin-transaction-builder"
rust-version = "1.56.1"
version = "0.1.0"

[dependencies]
bitcoin = { version = "0.32", features = ["arbitrary", "rand-std"] }
bitcoin-coin-selection = { version = "0.9", features = ["rand"] }
arbitrary = { version = "1", optional = true }

[dev-dependencies]
arbtest = "0.3"
# used for running example
esplora-client = { version = "0.13", features = ["blocking-https"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "from-coins"

[[example]]
name = "from-amount"
